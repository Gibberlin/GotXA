server {
    listen 80;
    server_name _;

    # Corporate Portal App (React SPA)
    location /corp_portal/ {
        alias /usr/share/nginx/html/corp_portal/;
        try_files $uri $uri/ /corp_portal/index.html;
        # Cache busting for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            alias /usr/share/nginx/html/corp_portal/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # SCADA Dashboard App (React SPA)
    location /scada_dashboard/ {
        alias /usr/share/nginx/html/scada_dashboard/;
        try_files $uri $uri/ /scada_dashboard/index.html;
        # Cache busting for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            alias /usr/share/nginx/html/scada_dashboard/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # SIEM Dashboard App (React SPA)
    location /siem_dashboard/ {
        alias /usr/share/nginx/html/siem_dashboard/;
        try_files $uri $uri/ /siem_dashboard/index.html;
        # Cache busting for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            alias /usr/share/nginx/html/siem_dashboard/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Root redirect to SIEM Dashboard
    location = / {
        return 301 /siem_dashboard/;
    }

    # Proxy API requests to Flask SIEM server
    location /api/ {
        proxy_pass http://siem-soar-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # For long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Catch-all 404
    error_page 404 =404 @not_found;
    location @not_found {
        access_log off;
        return 404 "Not found\n";
    }
}
