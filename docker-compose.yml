version: '3.9'

services:
  # ============================================================================
  # CACHE & MESSAGE BROKER
  # ============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    networks:
      - gotxa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"
    restart: unless-stopped

  # ============================================================================
  # DATABASES
  # ============================================================================
  
  siem-postgres:
    image: postgres:15-alpine
    container_name: siem-postgres
    environment:
      POSTGRES_USER: siem_user
      POSTGRES_PASSWORD: siem_password_secure
      POSTGRES_DB: siem_db
    volumes:
      - siem-db-data:/var/lib/postgresql/data
    networks:
      - gotxa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem_user -d siem_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    command:
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "shared_buffers=256MB"
    restart: unless-stopped

  # ============================================================================
  # BACKEND API SERVER
  # ============================================================================
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gotxa-backend
    environment:
      DATABASE_URL: postgresql://siem_user:siem_password_secure@siem-postgres:5432/siem_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLASK_ENV: production
      DEBUG: 'False'
      LOG_LEVEL: INFO
      REPORTS_DIR: /app/reports
    depends_on:
      siem-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gotxa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - reports-data:/app/reports
    restart: unless-stopped
  
  # ============================================================================
  # CELERY WORKER (Background Tasks & Report Generation)
  # ============================================================================
  
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: celery-worker
    environment:
      DATABASE_URL: postgresql://siem_user:siem_password_secure@siem-postgres:5432/siem_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLASK_ENV: production
      LOG_LEVEL: INFO
      REPORTS_DIR: /app/reports
    depends_on:
      siem-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - gotxa-net
    volumes:
      - ./backend:/app
      - reports-data:/app/reports
    restart: unless-stopped

  # ============================================================================
  # FRONTEND WEB SERVERS
  # ============================================================================
  
  siem-soar-frontend:
    build:
      context: .
      dockerfile: webservers/siem-soar-frontend/Dockerfile
    container_name: siem-soar-frontend
    networks:
      - gotxa-net
    depends_on:
      - backend
    volumes:
      - siem-frontend-data:/app/frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "80"

  corp-portal-frontend:
    build:
      context: .
      dockerfile: webservers/corp-portal-frontend/Dockerfile
    container_name: corp-portal-frontend
    networks:
      - gotxa-net
    depends_on:
      - backend
    volumes:
      - corp-frontend-data:/app/frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "80"

  scada-frontend:
    build:
      context: .
      dockerfile: webservers/scada-frontend/Dockerfile
    container_name: scada-frontend
    networks:
      - gotxa-net
    depends_on:
      - backend
    volumes:
      - scada-frontend-data:/app/frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "80"

  # ============================================================================
  # API GATEWAY / REVERSE PROXY
  # ============================================================================
  
  api-gateway:
    build:
      context: .
      dockerfile: webservers/api-gateway/Dockerfile
    container_name: api-gateway
    networks:
      - gotxa-net
    depends_on:
      - backend
      - siem-soar-frontend
      - corp-portal-frontend
      - scada-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=UTC
    restart: unless-stopped

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  siem-db-data:
    driver: local
  siem-frontend-data:
    driver: local
  corp-frontend-data:
    driver: local
  scada-frontend-data:
    driver: local
  reports-data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  gotxa-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16
